<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ScoreKept app icon, "Dirt and Chalk" (Steve picked C, Nov 2026, riffing on his photo of a
       kraft scorebook on home plate). Home plate seen straight down, point toward the catcher,
       with both batter's boxes chalked to scale: plate 17 in, boxes 3 x 7 ft, 6 in off the plate,
       centered on the plate's middle (9 px per inch, so the boxes' inner lines frame the plate and their corners fall just off the edge).
       The icon's own fixed colors. Full-bleed: iOS rounds the corners. -->
  <defs>
    <radialGradient id="dirt" cx="42%" cy="34%" r="85%">
      <stop offset="0" stop-color="#e2c592"/>
      <stop offset="0.65" stop-color="#c9a46c"/>
      <stop offset="1" stop-color="#a98450"/>
    </radialGradient>
    <linearGradient id="kraft" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#dbb27a"/>
      <stop offset="0.45" stop-color="#c89b62"/>
      <stop offset="1" stop-color="#b5854c"/>
    </linearGradient>
    <linearGradient id="chalk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7f4ec" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#f7f4ec" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#f7f4ec" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#dirt)"/>
  <circle cx="40" cy="90" r="5" fill="#8a6a3e" opacity="0.55"/><circle cx="38.5" cy="88.5" r="2.25" fill="#e2c592" opacity="0.6"/><circle cx="70" cy="470" r="4" fill="#8a6a3e" opacity="0.55"/><circle cx="68.5" cy="468.5" r="1.8" fill="#e2c592" opacity="0.6"/><circle cx="470" cy="70" r="5" fill="#8a6a3e" opacity="0.55"/><circle cx="468.5" cy="68.5" r="2.25" fill="#e2c592" opacity="0.6"/><circle cx="470" cy="420" r="6" fill="#8a6a3e" opacity="0.55"/><circle cx="468.5" cy="418.5" r="2.7" fill="#e2c592" opacity="0.6"/><circle cx="50" cy="300" r="3.5" fill="#8a6a3e" opacity="0.55"/><circle cx="48.5" cy="298.5" r="1.575" fill="#e2c592" opacity="0.6"/><circle cx="330" cy="490" r="4" fill="#8a6a3e" opacity="0.55"/><circle cx="328.5" cy="488.5" r="1.8" fill="#e2c592" opacity="0.6"/><circle cx="490" cy="230" r="4" fill="#8a6a3e" opacity="0.55"/><circle cx="488.5" cy="228.5" r="1.8" fill="#e2c592" opacity="0.6"/><circle cx="250" cy="22" r="3.5" fill="#8a6a3e" opacity="0.55"/><circle cx="248.5" cy="20.5" r="1.575" fill="#e2c592" opacity="0.6"/><circle cx="190" cy="500" r="5" fill="#8a6a3e" opacity="0.55"/><circle cx="188.5" cy="498.5" r="2.25" fill="#e2c592" opacity="0.6"/><circle cx="20" cy="170" r="3" fill="#8a6a3e" opacity="0.55"/><circle cx="18.5" cy="168.5" r="1.35" fill="#e2c592" opacity="0.6"/><circle cx="445" cy="300" r="3" fill="#8a6a3e" opacity="0.55"/><circle cx="443.5" cy="298.5" r="1.35" fill="#e2c592" opacity="0.6"/><circle cx="300" cy="420" r="3" fill="#8a6a3e" opacity="0.55"/><circle cx="298.5" cy="418.5" r="1.35" fill="#e2c592" opacity="0.6"/><circle cx="150" cy="40" r="3" fill="#8a6a3e" opacity="0.55"/><circle cx="148.5" cy="38.5" r="1.35" fill="#e2c592" opacity="0.6"/><circle cx="360" cy="40" r="4" fill="#8a6a3e" opacity="0.55"/><circle cx="358.5" cy="38.5" r="1.8" fill="#e2c592" opacity="0.6"/>
