<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- ScoreKept app icon: a hardbound scorebook. Colors are the icon's own
       fixed set (listed in tools/make-icons.mjs). Full-bleed: iOS rounds the corners. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c3060"/>
      <stop offset="1" stop-color="#0b1730"/>
    </linearGradient>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b51d36"/>
      <stop offset="1" stop-color="#8e0f24"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- White sticker outline -->
  <rect x="80" y="58" width="364" height="408" rx="30" fill="#ffffff"/>

  <!-- Cream page edges, peeking out right and bottom -->
  <rect x="104" y="80" width="326" height="372" rx="16" fill="#efe4c8"/>
  <g stroke="#c9b98f" stroke-width="2">
    <line x1="416" y1="96" x2="416" y2="436"/>
    <line x1="422" y1="100" x2="422" y2="432"/>
    <line x1="140" y1="438" x2="410" y2="438"/>
    <line x1="140" y1="444" x2="406" y2="444"/>
  </g>

  <!-- Cover -->
  <rect x="94" y="72" width="316" height="362" rx="16" fill="url(#cover)"/>

  <!-- Spine with chain stitching -->
  <path d="M110 72 H150 V434 H110 A16 16 0 0 1 94 418 V88 A16 16 0 0 1 110 72 Z" fill="#6e0a1b"/>
  <line x1="138" y1="92" x2="138" y2="414" stroke="#f3ead3" stroke-width="5" stroke-linecap="round" stroke-dasharray="12 11"/>

  <!-- Score-bug gloss and gold stripe -->
  <rect x="150" y="72" width="260" height="170" fill="url(#gloss)"/>
  <rect x="150" y="300" width="260" height="8" fill="#e3b23c"/>

  <!-- Diamond: thin baselines, three bases, a real home plate -->
  <g transform="translate(280 182)">
    <path d="M0 92 L84 8 L0 -76 L-84 8 Z" fill="none" stroke="#ffffff" stroke-width="4" stroke-linejoin="round"/>
    <rect x="-12" y="-12" width="24" height="24" fill="#ffffff" transform="translate(84 8) rotate(45)"/>
    <rect x="-12" y="-12" width="24" height="24" fill="#ffffff" transform="translate(0 -76) rotate(45)"/>
    <rect x="-12" y="-12" width="24" height="24" fill="#ffffff" transform="translate(-84 8) rotate(45)"/>
    <path d="M-14 82 H14 V94 L0 108 L-14 94 Z" fill="#ffffff"/>
  </g>

  <!-- R H E in a dark inset panel -->
  <rect x="176" y="324" width="208" height="92" rx="12" fill="#0b1730"/>
  <rect x="176" y="324" width="208" height="92" rx="12" fill="none" stroke="#000000" stroke-opacity="0.35" stroke-width="3"/>
  <g font-family="Alfa Slab One" text-anchor="middle">
    <g fill="#e3b23c" font-size="22">
      <text x="222" y="356">R</text>
      <text x="280" y="356">H</text>
      <text x="338" y="356">E</text>
    </g>
    <g fill="#ffffff" font-size="40">
      <text x="222" y="403">7</text>
      <text x="280" y="403">9</text>
      <text x="338" y="403">1</text>
    </g>
  </g>
</svg>
