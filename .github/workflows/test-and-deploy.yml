name: Test and deploy

# Every push to main: unit tests, then browser tests in Chromium and WebKit
# (Safari's engine). The app goes live on GitHub Pages only if all pass.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-and-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  browsers:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    # The WebKit install has hung for 40+ minutes before (LESSONS 36).
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache browser
        id: cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-ubuntu-24.04-${{ steps.pw.outputs.version }}-${{ matrix.browser }}
      - name: Install browser
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Install browser system libraries
        if: steps.cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: npx playwright install-deps ${{ matrix.browser }}
      - run: npm run build
      - run: npx playwright test --project=${{ matrix.browser }}

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [unit, browsers]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
