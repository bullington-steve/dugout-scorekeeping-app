name: Test and deploy

# Every push to main: unit tests, then browser tests in Chromium and WebKit
# (Safari's engine). The app goes live on GitHub Pages only if all pass.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-and-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  browsers:
    name: Browser tests (${{ matrix.browser }})
    runs-on: ubuntu-24.04
    # Playwright's own image already holds the browsers and their system
    # libraries, so a broken Ubuntu download mirror can't stop a publish
    # (LESSONS 65). Its version must match @playwright/test in package.json.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright test --project=${{ matrix.browser }}

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [unit, browsers]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
